---
# Template Semaphore: "Validar Integracao"
# Mesmo contrato do "Provisionar Cliente" (extra vars vps_ip, dominio, nome_loja), mas NAO toca em nenhuma VPS:
# executa so em localhost. Serve para provar, de ponta a ponta, n8n -> Integration -> Task -> Ansible.
- name: "Synapse - validar integracao n8n -> Semaphore"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Versao fixa do Synapse - ler o commit do codigo que esta sendo executado
      ansible.builtin.command: git -C "{{ playbook_dir }}/.." rev-parse HEAD
      register: synapse_head
      changed_when: false
    - name: Versao fixa do Synapse - o codigo executado TEM que ser o commit fixado (sem mudanca silenciosa)
      ansible.builtin.assert:
        that:
          - synapse_commit is defined
          - synapse_commit | length == 40
          - synapse_head.stdout == synapse_commit
        fail_msg: "Codigo executado ({{ synapse_head.stdout }}) difere do commit fixado ({{ synapse_commit | default('AUSENTE') }}). Repositorio mudou? Reexecute o instalador central para fixar uma nova versao DELIBERADAMENTE."
        success_msg: "Synapse commit instalado: {{ synapse_head.stdout }}"
    - name: Parametros do contrato presentes e bem formados
      ansible.builtin.assert:
        that:
          - vps_ip is defined
          - dominio is defined
          - vps_ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - dominio is match('^([a-z0-9-]+\.)+[a-z]{2,}$')
          - nome_loja is defined
        fail_msg: "Contrato da integracao violado (vps_ip, dominio, nome_loja)."
    - name: Eco do contrato recebido
      ansible.builtin.debug:
        msg: "INTEGRACAO_OK vps_ip={{ vps_ip }} dominio={{ dominio }} nome_loja={{ nome_loja }}"
